<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f5e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Tonartenverlauf</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // If the app has not drawn anything after a few seconds (old cache, unsupported browser …), say so and offer a way out.
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.children.length) return;
        app.innerHTML =
          '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;line-height:1.45">' +
          '<h2>Die Seite konnte nicht gestartet werden · The page could not start</h2>' +
          '<p>Möglicherweise ist eine ältere Version im Cache, oder der Browser ist zu alt. Öffne die Seite nicht als heruntergeladene Datei, sondern über die Internetadresse.<br>' +
          'An older version may be cached, or the browser is too old. Do not open a downloaded file; use the web address.</p>' +
          '<p><button id="tv-reset" style="padding:10px 14px;font-size:16px">Cache leeren &amp; neu laden / Clear cache &amp; reload</button></p></div>';
        document.getElementById('tv-reset').onclick = function () {
          var done = function () { location.reload(); };
          Promise.all([
            navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : 0,
            window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0
          ]).then(done, done);
        };
      }, 4000);
    </script>
  </body>
</html>
